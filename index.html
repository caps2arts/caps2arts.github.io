<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:CAP | Счетчик проекта</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; --light: #f8f9fa; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--light); text-align: center; padding: 20px; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; margin: 40px auto; }
        h1 { font-weight: 900; color: var(--dark); margin-bottom: 10px; }
        .counter { font-size: 5rem; font-weight: 900; color: var(--primary); margin: 20px 0; }
        .input-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        input { padding: 12px; border: 2px solid #ddd; border-radius: 10px; width: 120px; outline: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 700; }
        .btn:hover { background: #27ae60; }
        .status { font-size: 0.8rem; color: #888; margin-top: 15px; }
        .setup-box { margin-top: 20px; padding: 15px; background: #ffeaa7; border-radius: 10px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>RE:CAP</h1>
        <p>Собрано пластиковых крышек:</p>
        <div class="counter" id="capCount">Загрузка...</div>
        
        <div class="input-group">
            <input type="number" id="weightInput" placeholder="Вес (г)">
            <button class="btn" onclick="updateData()">Добавить</button>
        </div>
        <p class="status" id="dbStatus">Подключение к базе...</p>

        <div id="setupBlock" class="setup-box">
            <p>⚠️ База не подключена. Давай создадим её (без регистрации):</p>
            <button class="btn" style="background: #e17055; margin-top: 10px;" onclick="createDB()">Сгенерировать базу</button>
        </div>
    </div>

    <script>
        // 1. КОГДА СГЕНЕРИРУЕШЬ БАЗУ НА САЙТЕ, ВСТАВЬ ЕЁ ID СЮДА:
        const DATABASE_ID = ""; 
        
        // 2. ВАШ СЕКРЕТНЫЙ ПАРОЛЬ ДЛЯ КОМАНДЫ
        const PIN_CODE = "2026"; 

        let currentTotal = 0;

        // Загрузка данных при входе на сайт
        async function loadData() {
            if (!DATABASE_ID) {
                document.getElementById('capCount').innerText = "Нет базы";
                document.getElementById('dbStatus').innerText = "Требуется настройка";
                document.getElementById('setupBlock').style.display = "block";
                return;
            }

            try {
                const response = await fetch(`https://jsonblob.com/api/jsonBlob/${DATABASE_ID}`);
                const data = await response.json();
                currentTotal = data.caps;
                document.getElementById('capCount').innerText = currentTotal;
                document.getElementById('dbStatus').innerText = "Данные синхронизированы";
            } catch (error) {
                document.getElementById('dbStatus').innerText = "Ошибка загрузки данных";
            }
        }

        // Обновление данных (кнопка Добавить)
        async function updateData() {
            if (!DATABASE_ID) return alert("Сначала сгенерируйте базу!");
            
            const weight = document.getElementById('weightInput').value;
            if (!weight || weight <= 0) return;

            const pin = prompt("Введите пароль для обновления счетчика:");
            if (pin !== PIN_CODE) return alert("Неверный пароль! Доступ только для команды Алана.");

            document.getElementById('dbStatus').innerText = "Сохранение...";
            
            // Считаем крышки (вес делим на 2.5)
            const newCaps = Math.round(weight / 2.5);
            const newTotal = currentTotal + newCaps;

            try {
                // Отправляем новую цифру в облако
                await fetch(`https://jsonblob.com/api/jsonBlob/${DATABASE_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ caps: newTotal })
                });
                
                currentTotal = newTotal;
                document.getElementById('capCount').innerText = currentTotal;
                document.getElementById('weightInput').value = '';
                document.getElementById('dbStatus').innerText = "Успешно обновлено!";
            } catch (error) {
                document.getElementById('dbStatus').innerText = "Ошибка сохранения";
            }
        }

        // Автоматическое создание базы
        async function createDB() {
            document.getElementById('setupBlock').innerHTML = "Создаю...";
            try {
                const response = await fetch('https://jsonblob.com/api/jsonBlob', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ caps: 1540 }) // Начальное значение счетчика
                });
                
                const location = response.headers.get('Location');
                const id = location.split('/').pop(); 
                
                prompt("ГОТОВО! Скопируй этот ID и вставь его в код на GitHub (в const DATABASE_ID):", id);
                document.getElementById('setupBlock').innerHTML = `
                    <p>Твой уникальный ID базы:</p>
                    <h3 style="margin: 10px 0; color: #d63031;">${id}</h3>
                    <p>Скопируй его, вставь в код в <b>const DATABASE_ID</b> и сохрани файл на GitHub.</p>
                `;
            } catch (error) {
                alert("Ошибка при создании базы :(");
            }
        }

        loadData();
    </script>
</body>
</html>
